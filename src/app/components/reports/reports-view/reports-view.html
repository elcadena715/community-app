@if (isOpen) {
  <div class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px);">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg rounded-4">
        
        <div class="modal-header text-white py-3 rounded-top-4" style="background-color: var(--primary-color);">
          <h5 class="modal-title fw-bold">
            <i class="fa-solid fa-timeline me-2 text-warning"></i> 
            Linea Temporal del seguimiento - {{ reporte?.tipoReporte }}
          </h5>
          <button type="button" class="btn-close btn-close-white" (click)="cerrar()"></button>
        </div>

        <div class="modal-body p-4" style="max-height: 480px; overflow-y: auto;">
          <div class="timeline-wrapper ps-3">
            
            @for (hito of hitosTimeline(); track hito.id) {
              <div class="timeline-entry position-relative pb-4 ps-4">
                
                <div class="timeline-marker position-absolute start-0 translate-middle-x rounded-circle"
                     [ngClass]="{
                       'bg-dark': hito.estado === 'Pendiente',
                       'bg-warning': hito.estado === 'En revisión' || hito.estado === 'En Revisión',
                       'bg-success': hito.estado === 'Resuelto'
                     }">
                </div>
                
                <div class="card shadow-sm border-0 bg-light-subtle">
                  <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                      <h6 class="fw-bold mb-0 text-primary">{{ hito.autoridad }}</h6>
                      <small class="text-muted text-end">
                        <i class="fa-regular fa-calendar me-1"></i>{{ hito.fecha }} <br>
                        <i class="fa-regular fa-clock me-1"></i>{{ hito.hora }}
                      </small>
                    </div>
                    <p class="mb-2 text-dark small" style="text-align: left;">{{ hito.mensaje }}</p>
                    
                    <span class="badge rounded-pill px-3 py-1.5" 
                          [ngClass]="{
                            'bg-dark text-white': hito.estado === 'Pendiente',
                            'bg-warning text-dark': hito.estado === 'En revisión' || hito.estado === 'En Revisión',
                            'bg-success text-white': hito.estado === 'Resuelto'
                          }">
                      {{ hito.estado }}
                    </span>
                  </div>
                </div>

              </div>
            }

          </div>
        </div>

        <div class="modal-footer border-0 bg-light rounded-bottom-4">
          <button type="button" class="btn btn-secondary px-4 fw-bold" (click)="cerrar()">Entendido</button>
        </div>
      </div>
    </div>
  </div>
}
