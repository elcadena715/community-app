<div class="card product-card-horizontal shadow-sm border-0 rounded-4 bg-white mb-3">
  <div class="row no-gutters align-items-center p-3"> <div class="col-auto d-flex align-items-center justify-content-center">
      <div class="product-emoji-box rounded-3 d-flex align-items-center justify-content-center">
        <span class="fs-1">{{ producto.emoji || '📦' }}</span>
      </div>
    </div>
    
    <div class="col">
      <div class="card-body p-0 ms-3"> <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="card-title fw-bold text-dark m-0">{{ producto.name }}</h5>
          
          <div class="d-flex gap-1.5 align-items-center">
            @if (producto.condition) {
              <span class="badge custom-gray-badge badge-pill px-2.5 py-1.5 font-semibold">
                ✨ {{ producto.condition }}
              </span>
            }

            <span class="badge custom-gray-badge badge-pill px-2.5 py-1.5">
              {{ producto.status }}
            </span>
          </div>
        </div>

        <p class="card-text text-grey-custom small mb-3 text-truncate-2">
          {{ producto.description }}
        </p>
        
        <div class="d-flex justify-content-between align-items-center">
          <span class="fs-4 fw-bold text-primary-custom m-0">${{ producto.price | number:'1.2-2' }}</span>
          
          <button type="button" 
                  class="btn btn-contact btn-sm px-3 py-2 rounded-3 fw-semibold shadow-sm" 
                  (click)="onContactar.emit(producto)">
            <i class="fa-solid fa-comment-dots me-2"></i>Contactar al vecino
          </button>
        </div>

      </div>
    </div>

  </div>
</div>
